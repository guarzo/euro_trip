title: "Europe Trip Planning"
description: "Where, when, and how long — winter break 2028/29"
baseurl: ""
url: "https://eu.dpao.la"

# Nothing about this trip is decided yet. These are the candidates.
trip_season: "Winter break 2028/29"
trip_length_target: "~2 weeks"

family_members:
  - name: "Papa"
    emoji: "👨"
  - name: "Mama"
    emoji: "👩"
  - name: "Bubu"
    emoji: "👦"
    age: 18
  - name: "Gaby"
    emoji: "👧"
    age: 17

# Supabase backs the shared interest marks and comment threads. Both values
# are public by design — the anon key is meant to ship in the client. Fill
# them in after creating the project and applying supabase/schema.sql.
# While url is empty the site builds and deploys fine: the widgets render a
# short placeholder note instead, exactly as the old Giscus block did.
supabase:
  url: ""
  anon_key: ""

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

collections:
  cities:
    output: true
    permalink: /cities/:name/
  questions:
    output: true
    permalink: /questions/:name/

defaults:
  - scope:
      path: ""
      type: "cities"
    values:
      layout: "city"
  - scope:
      path: ""
      type: "questions"
    values:
      layout: "question"
