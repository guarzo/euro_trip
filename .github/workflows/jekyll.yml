name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # check.sh builds the site with our own Gemfile (Jekyll 4.3) and then
      # asserts against the output, so the artifact we upload below is the
      # exact tree we verified. We deliberately do NOT use
      # actions/jekyll-build-pages: it builds with the github-pages gem
      # (Jekyll 3.10), which would deploy a differently-built site from the
      # one the checks passed against.
      - name: Build and verify
        run: ./script/check.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
